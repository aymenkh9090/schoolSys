apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # uid figé : les dashboards provisionnés y font référence par uid.
    uid: prometheus
    access: proxy
    # Ici on est en communication conteneur → conteneur, donc on utilise
    # le nom du service Docker, pas host.docker.internal.
    url: http://prometheus:9090
    isDefault: true
    editable: true