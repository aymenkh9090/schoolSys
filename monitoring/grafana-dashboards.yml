apiVersion: 1

# Provisioning par fichier plutôt qu'import manuel dans l'UI : les dashboards
# survivent à un `docker compose down -v` et sont versionnés avec le reste.
providers:
  - name: SmartSchool
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    # 0 = ne pas recharger en boucle ; les fichiers ne bougent qu'au déploiement
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
