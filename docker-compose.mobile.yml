# Surcouche à n'utiliser QUE pour la démonstration mobile :
#
#   export LAN_HOST=192.168.0.235          # ip a | grep "inet 192"
#   docker compose -f docker-compose.yml -f docker-compose.mobile.yml up -d
#
# Sans elle, Keycloak en `start-dev` construit l'émetteur du jeton à partir de
# l'en-tête Host de la requête : un jeton demandé depuis le téléphone porte
# alors `http://<ip>:8081/...` là où l'API en attend `http://localhost:8081/...`,
# et l'API répond 401 sans que rien n'indique pourquoi. Fixer le nom d'hôte fait
# émettre le même émetteur quelle que soit l'origine de la demande.
#
# L'API doit être lancée avec le même émetteur :
#   export KEYCLOAK_ISSUER_URI="http://$LAN_HOST:8081/realms/smartschool"
#   export KEYCLOAK_SERVER_URL="http://$LAN_HOST:8081"

services:
  keycloak:
    environment:
      KC_HOSTNAME: http://${LAN_HOST:?export LAN_HOST=<IP du poste sur le réseau local>}:8081
      # L'API valide le jeton en allant chercher les clés publiques ; ce trajet
      # reste interne et n'a aucune raison de passer par l'IP publique.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"

  # Le service Python valide lui aussi l'émetteur du jeton. Sans cette ligne,
  # l'onglet « assistant » du mobile répondrait 401 alors que l'appel, lui,
  # fonctionnerait — la panne la plus déroutante à diagnostiquer en direct.
  ai-assistant:
    environment:
      KEYCLOAK_ISSUER_URL: http://${LAN_HOST}:8081/realms/smartschool
