server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Application à page unique : toute URL inconnue doit rendre index.html,
    # sinon un rafraîchissement sur /ecole/planning renvoie un 404 nginx — le
    # routeur React n'a jamais l'occasion de s'exécuter.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les assets portent un hash dans leur nom : ils ne changent jamais à URL
    # constante, on peut donc les mettre en cache sans limite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
