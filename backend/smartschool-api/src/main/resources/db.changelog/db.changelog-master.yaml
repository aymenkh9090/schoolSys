databaseChangeLog:
  # ── tenant schema ─────────────────────────────────────────────────────────
  - include:
      file: db/changelog.tenant/001-create-tenant.yaml
  - include:
      file: db/changelog.tenant/002-add-keycloak-columns.yaml
  - include:
      file: db/changelog.tenant/003-widen-tenant-logo.yaml

  # ── planning schema ────────────────────────────────────────────────────────
  #
  # Un seul include, et non la liste recopiée. Les deux listes avaient divergé
  # dans les deux sens : celle-ci ignorait les migrations 014, 015 et 016 — les
  # règles de la circulaire, le rapport de validation archivé, le ménage du
  # catalogue — et celle du module planning ignorait la 009. Les tests
  # exerçaient l'une, l'application exécutait l'autre, et rien ne les reliait.
  # C'est le défaut P1 du plan de conformité, appliqué aux migrations.
  #
  # Les chemins enregistrés dans databasechangelog.filename ne changent pas :
  # Liquibase y inscrit le fichier du changeset, pas celui qui l'inclut. Rien
  # n'est donc rejoué.
  - include:
      file: db/changelog.planing/db.changelog-master.yaml

  # ── absence schema ────────────────────────────────────────────────────────
  # Après le schéma planning : la reprise de fermeture_at lit planning_timetable_session.
  - include:
      file: db/changelog.absence/001-seance-appel-date-seance.yaml
  - include:
      file: db/changelog.absence/002-seance-appel-fermeture-at.yaml
