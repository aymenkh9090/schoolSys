spring:
  # ── Le .env de la racine, lu par l'API comme il l'est par docker compose ───
  # Sans ces lignes, `docker compose` lisait le .env et l'API non : les deux
  # cotes pouvaient donc diverger silencieusement sur LAN_HOST, et le seul
  # symptome etait un 401 que le front n'affichait pas. Chaque chemin est
  # `optional:` — un .env absent ne bloque pas le demarrage — et le suffixe
  # [.properties] dit a Spring comment lire un fichier sans extension.
  #
  # Les trois chemins couvrent les repertoires de travail possibles : la racine
  # du depot, `backend/`, et `backend/smartschool-api/` (celui de
  # `mvn spring-boot:run -pl smartschool-api`). Une variable d'environnement
  # exportee reste prioritaire sur le fichier.
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
  application:
    name: smartschool-api
  datasource:
    url: jdbc:postgresql://localhost:5432/smartschool
    username: postgres
    password: ${DB_PASSWORD:smartschool}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false
  liquibase:
    change-log: classpath:/db.changelog/db.changelog-master.yaml
    enabled: true
  # ── OAuth2 Resource Server ─────────────────────────────────────────────────
  # Spring télécharge automatiquement les clés JWKS depuis :
  #   {issuer-uri}/protocol/openid-connect/certs  (mis en cache)
  # et valide la signature du JWT Bearer entrant.
  security:
    oauth2:
      resourceserver:
        jwt:
          # L'API et Keycloak doivent designer le meme emetteur, au caractere
          # pres : Spring valide le claim `iss` et repond 401 sur la moindre
          # difference. Un telephone ne pouvant pas joindre "localhost", la
          # demonstration mobile passe par l'IP du poste — et les deux cotes
          # doivent basculer ensemble.
          #
          # D'ou le repli en cascade sur LAN_HOST, la MEME variable que celle
          # qui fixe KC_HOSTNAME dans docker-compose.yml : un seul
          # `export LAN_HOST=<ip>` aligne Keycloak, cette API et l'assistant.
          # KEYCLOAK_ISSUER_URI reste disponible pour forcer une valeur
          # complete, mais n'est plus necessaire au cas courant.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://${LAN_HOST:localhost}:8081/realms/smartschool}
  # ── Envoi d'email (mot de passe temporaire à la création de compte) ────────
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

app:
  # Phase 2 (avec Keycloak) : jwt → lit tenant_id depuis le JWT validé
  tenant-resolution: jwt
  frontend:
    # Utilisé pour construire le lien de connexion dans l'email de bienvenue.
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

# ── Keycloak Admin Client ───────────────────────────────────────────────────
# Utilisé par KeycloakAdminServiceImpl pour créer users/groupes via Admin REST API.
# Le service account (client_credentials) doit avoir les rôles :
#   manage-users, view-users dans realm-management.
keycloak:
  admin:
    # Meme cascade que l'emetteur ci-dessus : LAN_HOST suffit.
    server-url: ${KEYCLOAK_SERVER_URL:http://${LAN_HOST:localhost}:8081}
    realm: smartschool
    client-id: smartschool-backend
    client-secret: ${KC_CLIENT_SECRET}

management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      # "always" : expose le détail par composant (db, diskSpace, ping).
      # C'est ce détail que l'assistant IA va lire — sans lui, /health ne
      # renvoie que {"status":"UP"}, inexploitable pour un diagnostic.
      show-details: always
  metrics:
    tags:
      application: smartschool-api
      environment: ${ENVIRONMENT:demo}
    distribution:
      percentiles-histogram:
        # ⚠️ SANS CETTE LIGNE, AUCUN p95 N'EST CALCULABLE.
        # Micrometer n'exporterait que count/sum/max, et histogram_quantile()
        # renverrait toujours NaN. C'est l'oubli le plus fréquent.
        http.server.requests: true
      slo:
        http.server.requests: 100ms,200ms,500ms,1s,2s,5s
  health:
    mail:
      enabled: false     # ← ligne existante à conserver

# ── Métriques métier par établissement ────────────────────────────────────────
# Relevées périodiquement puis exposées sur /actuator/prometheus, à côté des
# métriques JVM. Le relevé est périodique et NON calculé au scrape : voir
# SchoolMetricsPublisher pour la raison (une requête SQL par métrique et par
# établissement à chaque scrape saturerait la base).
smartschool:
  metrics:
    school:
      enabled: true
      # 60 s : ces valeurs (nombre d'utilisateurs, de classes) bougent à
      # l'échelle de la journée. Plus fin ne montrerait rien de plus et
      # multiplierait les requêtes groupées pour rien.
      interval-ms: 60000
      # Laisse la base et Liquibase finir de démarrer avant le premier cycle.
      initial-delay-ms: 60000
      # Garde-fou de cardinalité : au-delà, le relevé est abandonné plutôt que
      # de saturer Prometheus. Chaque établissement ajoute une dizaine de séries.
      max-tenants: 500

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

timefold:
  solver:
    termination:
      # ── Pourquoi 300 s ne suffisaient pas ────────────────────────────────
      #
      # Mesuré sur le jeu de données du profil `demo` — collège Ibn Khaldoun,
      # 16 classes, 576 séances à poser sur 98 créneaux et 40 salles : le score
      # dur passe de -197 à -72 en cinq minutes, puis à -1 en dix. La coupure à
      # 300 s tombait donc en plein milieu de la descente et rendait un emploi
      # du temps criblé de conflits d'enseignant, de classe et de salle — non
      # parce que les données étaient mauvaises, mais parce qu'on arrêtait de
      # chercher trop tôt.
      #
      # `best-score-limit` d'abord : dès qu'un emploi du temps ne viole plus
      # aucune contrainte dure, il est exploitable et la recherche s'arrête. Le
      # plafond de temps n'est plus qu'un garde-fou pour le cas où la
      # faisabilité n'est pas atteignable.
      #
      # Ce que cela coûte : on s'arrête au PREMIER emploi du temps faisable,
      # sans polir les contraintes souples. Un établissement qui préfère la
      # qualité au délai retire cette ligne et laisse tourner les 30 minutes.
      best-score-limit: 0hard/*medium/*soft
      spent-limit: 1800s

logging:
  level:
    tn.wtm.school: DEBUG
    org.springframework.security: DEBUG
    org.keycloak: WARN
