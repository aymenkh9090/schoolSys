databaseChangeLog:
  - changeSet:
      id: 002-create-constraint-profile
      author: planning
      changes:
        - createTable:
            tableName: constraint_profile
            columns:
              - column:
                  name: id_constraint_profile
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_constraint_profile
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: academic_year_id
                  type: BIGINT
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(120)
                  defaultValue: system
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(120)
                  defaultValue: system
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: INTEGER
                  defaultValueNumeric: 0
        - addUniqueConstraint:
            tableName: constraint_profile
            constraintName: uk_constraint_profile_tenant_name_year
            columnNames: tenant_id,name,academic_year_id
        - createIndex:
            tableName: constraint_profile
            indexName: idx_constraint_profile_tenant
            columns:
              - column:
                  name: tenant_id
        - createIndex:
            tableName: constraint_profile
            indexName: idx_constraint_profile_year
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: academic_year_id
